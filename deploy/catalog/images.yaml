# The platform's image catalogue (docs/decisions/vm-images.md): the
# distributions' own amd64 cloud images, each pinned to a dated file and the
# sha256 of it. Apply it with `hangar apply -f deploy/catalog/images.yaml`
# through the admin socket; docs/runbook/vm-images.md says how, and how to
# move an image to a newer file. test/testbed/flow/images_test.go boots each
# of them (HANGAR_TESTBED_IMAGES).
#
# Where each sha256 comes from is noted above the image: the distribution's
# checksum file, beside the image, and the key its signature was checked
# with, by fingerprint, as the distribution's own site publishes it.
#
# The names have no dots, and a disk names its image by name: renaming one
# leaves its disks without an image. ubuntu-24-04 is as it was applied by
# hand before this file existed. Rocky 10 and AlmaLinux 10 are left out for
# now: docs/runbook/vm-images.md says why.

# SHA256SUMS of release-20260926, signed by the UEC Image Automatic Signing
# Key, D2EB44626FDDC30B513D5BB71A5D6C4C7DB87C81.
apiVersion: storage.hangarlab.cloud/v1alpha1
kind: Image
metadata: {name: ubuntu-24-04}
spec:
  url: https://cloud-images.ubuntu.com/releases/noble/release-20260926/ubuntu-24.04-server-cloudimg-amd64.img
  sha256: 6a81c37564db9b1ee84e141922625e1d7c5b389b99bb3c572e0243607d5bb4d2
  os: ubuntu
  version: "24.04"
  defaultUser: ubuntu
---
