# hangar-cloudflare config. Copy it outside the repo and fill it in; the
# real values never get committed. docs/runbook/cloudflare.md explains each.
# The API token is not here: it comes from CLOUDFLARE_API_TOKEN.

# The Cloudflare account (32 hex characters, on the dashboard's overview).
account_id: 00000000000000000000000000000000
# The control zone, which holds the API's hostname.
zone: example.com
# The public API's hostname, inside the zone.
hostname: api.example.com
# The tunnel's name, as the dashboard shows it.
tunnel_name: hangar
# Who may sign in through Google or a one-time PIN.
allowed_emails:
  - you@example.com
# The login methods' names under Zero Trust > Settings > Authentication.
identity_providers:
  google: Google
  # Optional; empty matches the account's only One-time PIN method.
  one_time_pin: One-time PIN
# Optional: public endpoints, under a zone of their own, apart from the
# control zone (user content never shares a domain with the API). Once
# applied, it can be neither changed nor removed here.
# endpoints:
#   zone: example.dev
