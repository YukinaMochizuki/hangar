syntax = "proto3";

// What a node agent asks of the apiserver for the machines placed on it,
// beyond the API. Unlike NodeService, the apiserver serves it, on the node
// socket, to node agents alone. Its compatibility is held by buf breaking
// as NodeService's is. See docs/decisions/secrets.md.
package hangar.node.v1;

// ImagePullCredentialsService gives a node the registry login to pull a
// machine's image with.
service ImagePullCredentialsService {
  // ResolveImagePullCredentials returns the login for the registry of the
  // machine's image, from the first of its image pull secrets that holds
  // one, or none. Only the node the machine is placed on may ask. The node
  // keeps the login for one pull, in memory, and never writes or logs it.
  rpc ResolveImagePullCredentials(ResolveImagePullCredentialsRequest) returns (ResolveImagePullCredentialsResponse);
}

message ResolveImagePullCredentialsRequest {
  string project = 1;
  // Names the Machine.
  string machine = 2;
}

message ResolveImagePullCredentialsResponse {
  // The registry the login is for, by host as references name it, such as
  // "ghcr.io" or "index.docker.io"; empty when there is no login, and the
  // image is pulled anonymously.
  string registry = 1;
  string username = 2;
  string password = 3;
  // An OAuth refresh token, used instead of a password.
  string identity_token = 4;
}

// VirtualTPMKeyService gives a node the key a machine's TPM state is
// encrypted with. See docs/decisions/vm-tpm.md.
service VirtualTPMKeyService {
  // ResolveVirtualTPMKey returns the TPM key of the machine, which must
  // have a TPM and be placed on the asking node. The node writes it to a
  // file only root reads, for the machine's VM, and never logs it.
  rpc ResolveVirtualTPMKey(ResolveVirtualTPMKeyRequest) returns (ResolveVirtualTPMKeyResponse);
}

message ResolveVirtualTPMKeyRequest {
  string project = 1;
  // Names the Machine.
  string machine = 2;
}

message ResolveVirtualTPMKeyResponse {
  // 32 bytes.
  bytes key = 1;
}
