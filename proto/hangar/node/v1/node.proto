syntax = "proto3";

// The protocol between the apiserver and the node agent, which the agent
// serves on the tunnel it opens to the apiserver (internal/tunnel). It is
// internal, not part of the API, but its compatibility is held by buf
// breaking all the same: the apiserver and a node may run different
// versions while one is upgraded. See docs/decisions/node-tunnel.md.
package hangar.node.v1;

import "google/protobuf/timestamp.proto";

// NodeService is what the apiserver asks of a node agent about the
// machines on its host.
service NodeService {
  // Logs streams a machine's console log, oldest first, across every boot
  // the host keeps, then, with follow, what is written as it comes.
  rpc Logs(LogsRequest) returns (stream LogsResponse);
  // Exec runs a process in a running machine's guest beside its
  // container's, for as long as the call lasts: once the call ends, the
  // process's group is killed. The first request starts it; later ones
  // carry its stdin, a resize or a signal. The responses carry its output
  // and, last, how it ended.
  rpc Exec(stream ExecRequest) returns (stream ExecResponse);
  // SSH connects to port 22 of a running firmware machine's first
  // interface, from its network's gateway inside the network's namespace,
  // and relays bytes both ways for as long as the call lasts. The first
  // request names the machine, which must be on this node; the node picks
  // the address. See docs/decisions/vm-ssh.md.
  rpc SSH(stream SSHRequest) returns (stream SSHResponse);
  // Console attaches to a running firmware machine's interactive serial
  // console for as long as the call lasts. The first request is a start
  // naming the machine, which must be on this node; the rest are as its
  // console helper takes them. A machine whose console takes no client,
  // as one started before consoles were interactive, fails with
  // FAILED_PRECONDITION. See docs/decisions/serial-console.md.
  rpc Console(stream ConsoleRequest) returns (stream ConsoleResponse);
  // UploadCustomImage writes one chunk of a CustomImage's upload to the
  // file the node stages it in. The first request says where the chunk
  // goes; later ones carry its bytes, length bytes in all. The chunk
  // counts only once its sha256 matches; one that does not is dropped,
  // INVALID_ARGUMENT, and one not at the node's count is refused before
  // its bytes are read, ABORTED. The response is the node's new count.
  rpc UploadCustomImage(stream UploadCustomImageRequest) returns (UploadCustomImageResponse);
  // GetCustomImageUpload says how many bytes of a CustomImage's upload
  // the node holds, every chunk checked: where the next chunk starts.
  rpc GetCustomImageUpload(GetCustomImageUploadRequest) returns (GetCustomImageUploadResponse);
}

message LogsRequest {
  string machine_uid = 1;
  // Goes on with what is written until the call ends, or the machine's VM,
  // once running, exits for good or is stopped.
  bool follow = 2;
  // Keeps only the last lines of what the log holds; unset keeps them
  // all. Each line of output, and each exit, is one.
  optional int64 tail_lines = 3;
  // Drops records older than this, by the time the guest gave them.
  google.protobuf.Timestamp since = 4;
}

message LogsResponse {
  repeated LogRecord records = 1;
}

// LogRecord is one record of a console log. All but its boot is what the
// guest asserts.
message LogRecord {
  // Numbers the VM's boots from 1; 0 means unknown.
  int64 boot = 1;
  LogStream stream = 2;
  google.protobuf.Timestamp time = 3;
  oneof content {
    // What the container or hangar-init wrote.
    bytes data = 4;
    // How the boot's process ended.
    ExitStatus exit = 5;
  }
}

// LogStream says what a record carries.
enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  LOG_STREAM_STDOUT = 1;
  LOG_STREAM_STDERR = 2;
  // hangar-init's own messages.
  LOG_STREAM_INIT = 3;
  LOG_STREAM_EXIT = 4;
}

// ExitStatus is how a container's process, or an exec's, ended.
message ExitStatus {
  int32 code = 1;
  // The signal that ended it, 0 if none.
  int32 signal = 2;
}

message ExecRequest {
  oneof message {
    // The first request, and only the first.
    ExecStart start = 1;
    // Only after a start with stdin.
    bytes stdin = 2;
    // Closes the process's stdin; on a terminal it sends end-of-file.
    ExecStdinClose stdin_close = 3;
    WindowSize resize = 4;
    // A signal number to send the process, such as 2.
    int32 signal = 5;
  }
}

// ExecStart starts an exec's process. What it leaves empty is the
// container's, as its machine's VM was started with.
message ExecStart {
  string machine_uid = 1;
  // The program, looked up on PATH as the process's environment sets it,
  // and its arguments.
  repeated string args = 2;
  // KEY=VALUE pairs set over the container's environment.
  repeated string env = 3;
  string working_dir = 4;
  // As an OCI image gives it, such as "1000:1000".
  string user = 5;
  // Runs the process on a terminal; its stdout and stderr are then one
  // stream.
  bool tty = 6;
  // The terminal's first size, with tty.
  WindowSize size = 7;
  // Gives the process a stdin to read. Without it, a process with no
  // terminal has its stdin closed at once.
  bool stdin = 8;
}

message ExecStdinClose {}

message WindowSize {
  uint32 rows = 1;
  uint32 cols = 2;
}

message ExecResponse {
  oneof message {
    bytes stdout = 1;
    bytes stderr = 2;
    // The last response.
    ExitStatus exit = 3;
  }
}

message SSHRequest {
  oneof message {
    // First, and only first.
    string machine_uid = 1;
    // What the client sends, as it comes.
    bytes data = 2;
  }
}

message SSHResponse {
  // What the guest's sshd sends, as it comes.
  bytes data = 1;
}

message UploadCustomImageRequest {
  oneof message {
    // The first request, and only the first.
    UploadChunk chunk = 1;
    // The chunk's bytes, in order.
    bytes data = 2;
  }
}

// UploadChunk says where a chunk of an upload goes.
message UploadChunk {
  string image_uid = 1;
  // Where in the file the chunk starts: the node's count of bytes held.
  int64 offset = 2;
  int64 length = 3;
  // SHA-256 of the chunk, as 64 lowercase hex digits.
  string sha256 = 4;
}

message UploadCustomImageResponse {
  int64 received_bytes = 1;
}

message GetCustomImageUploadRequest {
  string image_uid = 1;
}

message GetCustomImageUploadResponse {
  int64 received_bytes = 1;
}

// ConsoleRequest is what a client of a firmware machine's interactive
// serial console sends, to the node and, from the node, to the machine's
// console helper (docs/decisions/serial-console.md).
message ConsoleRequest {
  oneof message {
    // The first request, and only the first.
    ConsoleStart start = 1;
    // What the client types, as it comes; the guest gets it only while
    // the client holds the console's input.
    bytes input = 2;
    // The screen's new size; taken only from the client holding the
    // input.
    ConsoleSize resize = 3;
  }
}

// ConsoleStart attaches a client to a machine's serial console.
message ConsoleStart {
  // Names the machine, which must be on the node; empty to its helper.
  string machine_uid = 1;
  // Only watches: never holds the input.
  bool read_only = 2;
  // Takes the input from whoever holds it, who goes on watching; without
  // it, a client finding the input held watches.
  bool force = 3;
}

// ConsoleSize is a screen's size in character cells.
message ConsoleSize {
  uint32 columns = 1;
  uint32 rows = 2;
}

// ConsoleResponse is what an attached client gets: its state first, then
// the screen drawn whole, then what the guest writes, and its state again
// whenever it changes.
message ConsoleResponse {
  oneof message {
    // Bytes for the client's terminal, as they come.
    bytes output = 1;
    ConsoleState state = 2;
    // Why the client is let go while the VM runs, such as for falling
    // behind; the last message. A console ending with no reason ended
    // with its VM.
    string ended = 3;
  }
}

// ConsoleState is how a client is attached.
message ConsoleState {
  // The client holds the console's input.
  bool input = 1;
  // The screen's size, which the guest is told only by its user (stty).
  ConsoleSize size = 2;
}
