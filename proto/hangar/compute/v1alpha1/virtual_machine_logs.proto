syntax = "proto3";

package hangar.compute.v1alpha1;

import "google/protobuf/timestamp.proto";

// VirtualMachineLogsService reads virtual machines' serial consoles. It is
// not a resource's service, so it is written by hand rather than generated.
// See docs/decisions/vm-boot.md.
service VirtualMachineLogsService {
  // VirtualMachineLogs streams what a VM wrote to its serial console,
  // oldest first, as one stream across every boot its node keeps, with the
  // end of each boot; with follow it goes on with what is written. It needs
  // compute.virtualmachines.logs. A VM whose machine is not on a node yet
  // fails with FailedPrecondition, and one whose node is not connected with
  // Unavailable.
  rpc VirtualMachineLogs(VirtualMachineLogsRequest) returns (stream VirtualMachineLogsResponse);
}

message VirtualMachineLogsRequest {
  string project = 1;
  string name = 2;
  // Goes on with what is written until the call ends, or the VM, once
  // running, powers off or is stopped.
  bool follow = 3;
  // Keeps only the last lines of what the log holds; unset keeps them
  // all. Each line of output, and each boot's end, is one.
  optional int64 tail_lines = 4;
  // Drops records older than this.
  google.protobuf.Timestamp since = 5;
}

message VirtualMachineLogsResponse {
  repeated VirtualMachineLogRecord records = 1;
}

// VirtualMachineLogRecord is a piece of a VM's serial console, timed by its
// host as it came, or the end of a boot.
message VirtualMachineLogRecord {
  // Numbers the VM's boots from 1; 0 means unknown.
  int64 boot = 1;
  google.protobuf.Timestamp time = 2;
  oneof content {
    bytes data = 3;
    VirtualMachineBootEnd end = 4;
  }
}

// VirtualMachineBootEnd is how a boot of a VM ended.
message VirtualMachineBootEnd {
  // 0 when the guest powered off, 253 when the VM ended otherwise, as by a
  // crash or a kill.
  int32 code = 1;
  // The platform ended the boot, pressing the VM's power button: the VM
  // was stopped, or its host shut down, and it boots again when started or
  // when its host is back. Only a boot whose guest powered off on its own,
  // code 0 and not stopped, leaves the VM off until it is stopped and
  // started.
  bool stopped = 2;
}
