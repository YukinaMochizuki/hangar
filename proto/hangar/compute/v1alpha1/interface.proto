syntax = "proto3";

package hangar.compute.v1alpha1;

// NetworkInterface is one network interface a Container or VirtualMachine
// asks for. Its name is eth0, eth1… by position; its address comes from the
// network's range.
message NetworkInterface {
  // Names a network in the object's project.
  string network = 1;
  // SecurityGroups of the network the interface is in; empty is the
  // network's implicit "default" alone. Naming others without "default"
  // leaves it.
  repeated string security_groups = 3;
  reserved 2;
}
