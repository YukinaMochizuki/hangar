syntax = "proto3";

package hangar.compute.v1alpha1;

// Placement describes the hardware of a machine's host, never its load;
// every tenant with a machine on the node reads it. Fields are at most 64
// printable characters. See docs/decisions/machine-placement.md.
message Placement {
  // The region the host is in, such as "ap-southeast", from the node's
  // configuration.
  string region = 1;
  // The site within the region, such as a datacenter's name "SGP02", from
  // the node's configuration.
  string site = 2;
  // The CPU as the host names it, without its core count, such as
  // "AMD EPYC 7313".
  string cpu_model = 3;
  // The CPU's microarchitecture and code name, such as "Zen 3 (Milan)":
  // known to the node agent for the CPUs it has a name for, or from the
  // node's configuration.
  string cpu_generation = 4;
  // The host's disks by kind, such as "2 × NVMe SSD".
  string storage = 5;
  // Names the host's chassis, a DNS-1123 label such as "generic-1u-2x-u2";
  // a client draws one it does not know, or none, as a generic server.
  string chassis = 6;
}
