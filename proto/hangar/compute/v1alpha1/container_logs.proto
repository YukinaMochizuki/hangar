syntax = "proto3";

package hangar.compute.v1alpha1;

import "google/protobuf/timestamp.proto";

// ContainerLogsService reads what containers wrote. It is not a resource's
// service, so it is written by hand rather than generated. See
// docs/decisions/node-tunnel.md.
service ContainerLogsService {
  // ContainerLogs streams a container's output, oldest first, as one
  // stream across every boot its node keeps, with hangar-init's messages
  // and each exit in it; with follow it goes on with what is written. It
  // needs compute.containers.logs. A container whose machine is not on a
  // node yet fails with FailedPrecondition, and one whose node is not
  // connected with Unavailable.
  rpc ContainerLogs(ContainerLogsRequest) returns (stream ContainerLogsResponse);
}

message ContainerLogsRequest {
  string project = 1;
  string name = 2;
  // Goes on with what is written until the call ends, or the container,
  // once running, exits for good or is stopped.
  bool follow = 3;
  // Keeps only the last lines of what the log holds; unset keeps them
  // all. Each line of output, and each exit, is one.
  optional int64 tail_lines = 4;
  // Drops records older than this, by the time the container gave them.
  google.protobuf.Timestamp since = 5;
}

message ContainerLogsResponse {
  repeated ContainerLogRecord records = 1;
}

// ContainerLogRecord is one piece of a container's output. All but its
// boot is what the container asserts: its own process can write any
// records, an exit's included.
message ContainerLogRecord {
  // Numbers the container's boots from 1, a restart being a new boot; 0
  // means unknown.
  int64 boot = 1;
  ContainerLogStream stream = 2;
  google.protobuf.Timestamp time = 3;
  oneof content {
    // What the process or hangar-init wrote.
    bytes data = 4;
    // How the boot's process ended.
    ContainerExitStatus exit = 5;
  }
}

// ContainerLogStream says what a record carries.
enum ContainerLogStream {
  CONTAINER_LOG_STREAM_UNSPECIFIED = 0;
  CONTAINER_LOG_STREAM_STDOUT = 1;
  CONTAINER_LOG_STREAM_STDERR = 2;
  // hangar-init's own messages, such as why a process could not start.
  CONTAINER_LOG_STREAM_INIT = 3;
  CONTAINER_LOG_STREAM_EXIT = 4;
}

// ContainerExitStatus is how a container's process ended.
message ContainerExitStatus {
  // 253 when the guest recorded none, as after a crash.
  int32 code = 1;
  // The signal that ended it, 0 if none.
  int32 signal = 2;
}
