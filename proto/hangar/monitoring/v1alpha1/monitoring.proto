syntax = "proto3";

package hangar.monitoring.v1alpha1;

import "google/protobuf/timestamp.proto";

// MonitoringService is the platform's health, for its administrators: fixed
// queries the apiserver makes of the host's Prometheus and Alertmanager.
// There is no query passthrough: the PromQL behind each answer lives in the
// apiserver, so a caller can ask only what this service names. Every call
// needs platform.monitoring.read, which platform.root and platform.sponsor
// hold, and those asking Prometheus (or, for ListAlerts, Alertmanager) fail
// with UNAVAILABLE while the apiserver has none to ask, or cannot reach it.
// Nothing answered names a tenant, a project or a machine: machines are
// counted. It is not a resource's service, so it is written by hand rather
// than generated. See docs/decisions/monitoring.md.
service MonitoringService {
  // GetOverview answers each layer's state now: reachability and the
  // machines, counted, for the platform; the host and its services for each
  // node.
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
  // GetSeries answers one named series over a range, at a step the server
  // picks for the range: a host's for the node named, or the platform's.
  rpc GetSeries(GetSeriesRequest) returns (GetSeriesResponse);
  // ListAlerts answers the alerts firing now, from Alertmanager, but those
  // silenced or inhibited and the always-firing Watchdog.
  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsResponse);
  // ListNodeUsage answers, for each node, how many machines are placed on
  // it and what they hold there, as the scheduler counts it. It reads the
  // store, not Prometheus, so it answers while Prometheus is down.
  rpc ListNodeUsage(ListNodeUsageRequest) returns (ListNodeUsageResponse);
}

// Health is a layer's or a check's state.
enum Health {
  HEALTH_UNSPECIFIED = 0;
  HEALTH_OK = 1;
  // As an alert of severity warning would say, whether or not one fires yet.
  HEALTH_WARNING = 2;
  // As an alert of severity critical would say.
  HEALTH_CRITICAL = 3;
  // Recorded and shown, alerting no one: what a tenant's own program did.
  HEALTH_INFO = 4;
  // Prometheus has no data for the check, such as when an exporter is down.
  HEALTH_UNKNOWN = 5;
}

// Layer names one of the four layers the platform is watched in. Two are
// the platform's, two each node's.
enum Layer {
  LAYER_UNSPECIFIED = 0;
  // The platform's: the API and the console over HTTPS, and their
  // certificates.
  LAYER_REACHABILITY = 1;
  // A node's: CPU, memory, swap, the ZFS pools, the md mirror, the NVMe
  // disks, time.
  LAYER_HOST = 2;
  // A node's: each hangar-* unit on its host, the apiserver's included
  // where it runs, the Node's Ready, and its agent's tunnel.
  LAYER_SERVICES = 3;
  // The platform's: tenants' machines, counted.
  LAYER_MACHINES = 4;
}

message GetOverviewRequest {}

message GetOverviewResponse {
  // When Prometheus was asked.
  google.protobuf.Timestamp observe_time = 1;
  // The platform's layers, LAYER_REACHABILITY and LAYER_MACHINES, in that
  // order.
  repeated LayerState layers = 2;
  // Each node, by name: every Node this apiserver accepts, and any other
  // Prometheus has series of.
  repeated NodeOverview nodes = 3;
}

// NodeOverview is one node's layers.
message NodeOverview {
  // The Node's name, which its host's series carry as their node label.
  string name = 1;
  // LAYER_HOST and LAYER_SERVICES, in that order.
  repeated LayerState layers = 2;
}

// LayerState is one layer's state now.
message LayerState {
  Layer layer = 1;
  // The worst of its checks', and, for the machines layer, CRITICAL while
  // a machine is blocked by the platform.
  Health health = 2;
  repeated Check checks = 3;
  // Set for LAYER_MACHINES alone.
  MachineCounts machines = 4;
}

// Check is one line of a layer: what is checked, and what it reads now.
message Check {
  // What is checked, such as "CPU", "Pool hangar" or "hangar-apiserver".
  string name = 1;
  Health health = 2;
  // What it reads, for people, such as "ONLINE · 344 of 840 GiB · 41%".
  string value = 3;
}

// MachineCounts are the platform's machines, counted, never named.
message MachineCounts {
  // Machines by phase, every phase in a fixed order, those with none too.
  repeated PhaseCount phases = 1;
  // Machines blocked for a reason only the platform causes (DiskFailed,
  // NetworkFailed), by reason; these alert.
  repeated ReasonCount platform_failures = 2;
  // Machines ended by their own program (Exited, BootFailed), by reason;
  // recorded, alerting no one.
  repeated ReasonCount program_failures = 3;
  // Machines in a crash loop; recorded, alerting no one.
  int32 crash_looping = 4;
}

message PhaseCount {
  // A machine phase's word: "Running", "Pending", "Creating", "Stopped",
  // "Suspended" or "Failed".
  string phase = 1;
  int32 count = 2;
}

message ReasonCount {
  // A reason of a machine's Ready condition, such as "DiskFailed".
  string reason = 1;
  int32 count = 2;
}

// SeriesName names a series. Each is one fixed query in the apiserver. The
// HOST_ and POOL_ series are a node's, the API_ ones the platform's.
enum SeriesName {
  SERIES_NAME_UNSPECIFIED = 0;
  // The share of the node's CPU time not idle; UNIT_RATIO.
  SERIES_NAME_HOST_CPU = 1;
  // The node's memory in use, the ARC the kernel can take back counted as
  // free; UNIT_BYTES, out of the node's memory.
  SERIES_NAME_HOST_MEMORY = 2;
  // What the node's ZFS pools hold; UNIT_BYTES, out of their size.
  SERIES_NAME_POOL_USED = 3;
  // The API's calls a second; UNIT_PER_SECOND.
  SERIES_NAME_API_REQUEST_RATE = 4;
  // The share of the API's calls that failed on the server's side
  // (unknown, internal, unavailable, data loss), as the alerting rule
  // ApiErrorsHigh counts them; UNIT_RATIO.
  SERIES_NAME_API_ERROR_RATE = 5;
  // The 99th percentile of how long the API's unary calls took, as the
  // alerting rule ApiLatencyHigh has it; UNIT_SECONDS.
  SERIES_NAME_API_LATENCY_P99 = 6;
}

// SeriesRange is how far back a series reaches from now. The server picks
// the step: a minute for an hour, 15 minutes for a day, an hour for 7 days.
enum SeriesRange {
  SERIES_RANGE_UNSPECIFIED = 0;
  SERIES_RANGE_ONE_HOUR = 1;
  SERIES_RANGE_ONE_DAY = 2;
  SERIES_RANGE_SEVEN_DAYS = 3;
}

// Unit is what a series' values count.
enum Unit {
  UNIT_UNSPECIFIED = 0;
  // A share, 0 to 1.
  UNIT_RATIO = 1;
  UNIT_BYTES = 2;
  UNIT_PER_SECOND = 3;
  UNIT_SECONDS = 4;
}

message GetSeriesRequest {
  SeriesName name = 1;
  SeriesRange range = 2;
  // The Node a node's series is for: required for those, refused for the
  // platform's. An unknown Node is NOT_FOUND.
  string node = 3;
}

message GetSeriesResponse {
  SeriesName name = 1;
  // The Node the series is for; empty for the platform's.
  string node = 2;
  Unit unit = 3;
  // The time between points, which the server picks for the range.
  int32 step_seconds = 4;
  // Oldest first. A step with no value, such as a share of no calls or one
  // while Prometheus was down, has no point.
  repeated Point points = 5;
  // What the value is out of, when it has a ceiling: the host's memory, the
  // pools' size. Unset otherwise.
  optional double capacity = 6;
  // Where an alerting rule fires on the series' value, when one does. Unset
  // otherwise.
  optional double alert_above = 7;
}

message Point {
  google.protobuf.Timestamp time = 1;
  double value = 2;
}

message ListNodeUsageRequest {}

message ListNodeUsageResponse {
  // Each Node, by name, those with no machine too.
  repeated NodeUsage nodes = 1;
}

// NodeUsage is what the machines placed on one node hold there, summed,
// never which machines they are.
message NodeUsage {
  // The Node's name.
  string node = 1;
  // Machines placed on the node.
  int32 machines = 2;
  // The vCPUs the machines are given, summed: vCPUs are shared, not
  // reserved, so this may pass what the node offers. A quantity, such as
  // "12".
  string cpu = 3;
  // The memory the machines are given, a quantity such as "24Gi".
  string memory = 4;
  // The disk held on the node, a quantity such as "300Gi": the machines'
  // disks, and the Disks and FileShares placed there, at the sizes they
  // were made, as the scheduler counts them.
  string disk = 5;
}

message ListAlertsRequest {}

message ListAlertsResponse {
  // Most severe first, then oldest first.
  repeated Alert alerts = 1;
}

// Severity is an alert's, as its rule labels it.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  // Sent at once.
  SEVERITY_CRITICAL = 1;
  // Held to the daily window.
  SEVERITY_WARNING = 2;
}

// Alert is one alert firing now.
message Alert {
  // The alerting rule's name, such as "ZpoolNotOnline".
  string name = 1;
  // An alert whose rule labels no known severity counts as critical, as
  // Alertmanager routes it.
  Severity severity = 2;
  // The rule's summary annotation.
  string summary = 3;
  google.protobuf.Timestamp start_time = 4;
  // The Node the alert is for, from its node label, which every series a
  // host's Prometheus scrapes from that host carries; empty for the
  // platform's, such as the API's errors.
  string node = 5;
}
