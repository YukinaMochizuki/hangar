syntax = "proto3";

// The protocol between the node agent and hangar-init, which is PID 1 and
// the agent in every container's guest. It is internal, not part of the
// API, but its compatibility is held by buf breaking all the same: a guest
// keeps the hangar-init it booted with while the node is upgraded. See
// docs/decisions/guest-agent.md.
package hangar.guest.v1;

import "google/protobuf/duration.proto";
import "hangar/guest/v1/converter.proto";
import "hangar/guest/v1/file_share.proto";

// BootConfig is all a guest needs from the node to boot, and to boot again:
// what to run and how it reaches the network. It comes on a small read-only
// disk (internal/guest/bootdisk).
message BootConfig {
  // The container's main process. The guest powers off when it exits.
  // Unused by a FileShare's server.
  Process process = 1;
  repeated Interface interfaces = 2;
  string hostname = 3;
  // Resolver addresses for /etc/resolv.conf.
  repeated string nameservers = 4;
  // Search domains for /etc/resolv.conf.
  repeated string search = 5;
  // The volumes to mount before the process runs, in this order. See
  // docs/decisions/container-volumes.md.
  repeated Volume volumes = 6;
  // The machine's uid, its NFSv4 client identity: unique to the machine,
  // and not the hostname, which the tenant sets.
  string machine_uid = 7;
  // Set, the guest is this FileShare's server instead of a container: it
  // has no root disk and no process, and ignores volumes.
  FileShareServer file_share_server = 8;
  // Set, the guest is a converter VM instead of a container: it has no
  // root disk, process or network, and ignores volumes. Only the converter
  // initramfs holds what it runs.
  ImageConverter image_converter = 9;
  // Set, the container joins a tailnet as it boots: hangar-init runs
  // tailscaled beside its process. SetTailnet changes it while the guest
  // runs, and the node rewrites the boot disk to match, so a boot of the
  // restart policy comes up as last told. See
  // docs/decisions/container-tailscale.md.
  Tailscale tailscale = 10;
  // The read-only disk holding tailscaled and the tailscale CLI, such as
  // /dev/vde, given to every container whether or not it joins a tailnet,
  // so it can join later: hangar-init mounts it at /run/hangar/tailscale as
  // the container first joins. Empty when the host has none.
  string tailscale_disk = 11;
}

// Tailscale is how a container joins a tailnet. The auth key is not here:
// it comes from the node through JoinTailnet, and only while the guest has
// no node state of its own.
message Tailscale {
  // The node's hostname on the tailnet.
  string hostname = 1;
  // Accept the subnet routes the tailnet offers.
  bool accept_routes = 2;
}

// Volume is a disk the guest mounts, formatted when blank and filled from
// the image when new; or a FileShare, mounted over NFS, never filled.
message Volume {
  // The block device, such as /dev/vdc; empty for a FileShare.
  string device = 1;
  // An absolute path, resolved in the root disk.
  string target = 2;
  bool read_only = 3;
  // Leaves a new volume empty.
  bool nocopy = 4;
  // A directory of the volume, relative, mounted instead of all of it.
  string subpath = 5;
  // The Disk's or the FileShare's name, for messages.
  string name = 6;
  // Set for a FileShare instead of device. It is mounted once the network
  // is up, and nocopy is implied.
  FileShareMount file_share = 7;
}

// Process is a process to run in the guest.
message Process {
  // The first is the program, looked up on PATH as set in env.
  repeated string args = 1;
  // KEY=VALUE pairs.
  repeated string env = 2;
  // Empty means the root directory.
  string working_dir = 3;
  // As an OCI image gives it: "uid", "uid:gid", "name" or "name:group",
  // looked up in the guest's /etc/passwd and /etc/group. Empty means root.
  string user = 4;
}

// Interface is one network interface, found in the guest by its MAC.
message Interface {
  // Such as 02:00:00:00:00:01.
  string mac = 1;
  // With the network's prefix length, such as 10.0.0.5/24.
  string address = 2;
  // The default route through this interface; empty for none.
  string gateway = 3;
  // The interface's public IPv6 address, such as 2001:db8::5/128; empty for
  // none.
  string ipv6 = 4;
  // The IPv6 default route through this interface, a link-local address
  // such as fe80::1; empty for none.
  string ipv6_gateway = 5;
}

// GuestAgentService is served by hangar-init over vsock.
service GuestAgentService {
  // Ping answers once the guest is up.
  rpc Ping(PingRequest) returns (PingResponse);
  // Exec runs a process beside the container's main one. The first request
  // starts it; later ones carry its stdin, a resize or a signal. The
  // responses carry its output and, last, how it ended.
  rpc Exec(stream ExecRequest) returns (stream ExecResponse);
  // Stop stops the container's main process as docker stop does: SIGTERM
  // to its process group, then SIGKILL once the grace period has passed.
  // The guest then records how the process ended and powers off, as when
  // it exits by itself. It answers once SIGTERM is sent; asking again
  // changes nothing.
  rpc Stop(StopRequest) returns (StopResponse);
  // SetIPv6 makes each interface's public IPv6 address, and the IPv6
  // default route, what is given, as the boot disk would at boot, while the
  // container runs: the address its interface holds now, which may have
  // moved since it booted. The other addresses of an interface stay.
  rpc SetIPv6(SetIPv6Request) returns (SetIPv6Response);
  // RootUsage says how full the root filesystem is, as statfs(2) says.
  rpc RootUsage(RootUsageRequest) returns (RootUsageResponse);
  // GrowRoot grows the mounted root filesystem to its whole device, as
  // the guest does at boot, once the host has grown the device while the
  // guest runs. See docs/decisions/disk-autogrow.md.
  rpc GrowRoot(GrowRootRequest) returns (GrowRootResponse);
  // VolumeUsage says how full the filesystem of a volume the boot disk
  // listed is, as statfs(2) says, as RootUsage does for the root.
  rpc VolumeUsage(VolumeUsageRequest) returns (VolumeUsageResponse);
  // GrowVolume grows the mounted filesystem of a volume the boot disk listed
  // to its whole device, once the host has grown the device while the guest
  // runs. See docs/decisions/disk-autogrow.md.
  rpc GrowVolume(GrowVolumeRequest) returns (GrowVolumeResponse);
  // SetTailnet makes the guest join the tailnet as told, or, told none,
  // leave it, while it runs: joining starts tailscaled and the DNS split;
  // leaving logs the node out, stops tailscaled, deletes its state, so a
  // later join is a new node, and restores the container's resolvers; a
  // new hostname or accept_routes is set on the running node. It answers
  // at once; TailnetStatus says how it went.
  rpc SetTailnet(SetTailnetRequest) returns (SetTailnetResponse);
  // TailnetStatus says where the guest's tailnet join stands.
  rpc TailnetStatus(TailnetStatusRequest) returns (TailnetStatusResponse);
  // JoinTailnet gives a guest with no node state the auth key to join
  // with, as its TailnetStatus NEEDS_KEY asks, or again after
  // KEY_REJECTED or FAILED; a guest with node state refuses it with
  // FAILED_PRECONDITION. It answers once the join has begun; TailnetStatus
  // says how it went. The guest keeps the key in memory for the join alone.
  rpc JoinTailnet(JoinTailnetRequest) returns (JoinTailnetResponse);
  // MemoryUsage says how much memory the guest's kernel has and how much
  // of it is available, as /proc/meminfo says. See
  // docs/decisions/machine-usage.md.
  rpc MemoryUsage(MemoryUsageRequest) returns (MemoryUsageResponse);
}

message MemoryUsageRequest {}

message MemoryUsageResponse {
  // MemTotal and MemAvailable of /proc/meminfo, in bytes: what the guest
  // uses is their difference.
  uint64 total = 1;
  uint64 available = 2;
}

message TailnetStatusRequest {}

message TailnetStatusResponse {
  TailnetState state = 1;
  // What the state is about, such as the node's name on the tailnet, or why
  // it failed.
  string message = 2;
  // The guest asks for the auth key now: it has no node state, and was
  // given no key since it last joined, or the last it was given failed
  // long enough ago to be tried again. The guest keeps that time, so the
  // node's own restarts do not hurry it.
  bool wants_key = 3;
}

// TailnetState is where a guest's tailnet join stands.
enum TailnetState {
  TAILNET_STATE_UNSPECIFIED = 0;
  // tailscaled is starting, or a join is under way.
  TAILNET_STATE_STARTING = 1;
  // The guest has no node state, and waits for an auth key.
  TAILNET_STATE_NEEDS_KEY = 2;
  // The guest is a node of the tailnet, and connected.
  TAILNET_STATE_JOINED = 3;
  // The tailnet refused the auth key last given.
  TAILNET_STATE_KEY_REJECTED = 4;
  // The join, or tailscaled, failed otherwise.
  TAILNET_STATE_FAILED = 5;
  // The guest is told to join no tailnet, and runs no tailscaled.
  TAILNET_STATE_OFF = 6;
}

message SetTailnetRequest {
  // Unset leaves the tailnet.
  Tailscale tailscale = 1;
}

message SetTailnetResponse {}

message JoinTailnetRequest {
  string auth_key = 1;
}

message JoinTailnetResponse {}

message VolumeUsageRequest {
  // The volume's device, as the boot disk lists it, such as /dev/vdc.
  string device = 1;
}

message VolumeUsageResponse {
  // The filesystem's size and what is used of it, in bytes.
  uint64 size = 1;
  uint64 used = 2;
  // The filesystem's inodes and how many are used, as RootUsageResponse's.
  uint64 files = 3;
  uint64 files_used = 4;
}

message GrowVolumeRequest {
  // The volume's device, as the boot disk lists it, such as /dev/vdc.
  string device = 1;
}

message GrowVolumeResponse {
  // The volume's filesystem's size once grown, in bytes.
  uint64 size = 1;
}

message RootUsageRequest {}

message RootUsageResponse {
  // The filesystem's size and what is used of it, in bytes. With no root
  // reserve, used plus available is size.
  uint64 size = 1;
  uint64 used = 2;
  // The filesystem's inodes and how many are used: a filesystem can run
  // out of them with bytes to spare. A guest that does not say them says
  // 0 of 0.
  uint64 files = 3;
  uint64 files_used = 4;
}

message GrowRootRequest {}

message GrowRootResponse {
  // The root filesystem's size once grown, in bytes.
  uint64 size = 1;
}

message SetIPv6Request {
  // Each interface by its MAC, with its ipv6 and ipv6_gateway; an empty
  // ipv6 takes the interface's public address away. The rest is ignored.
  repeated Interface interfaces = 1;
}

message SetIPv6Response {}

message StopRequest {
  // How long the process has between SIGTERM and SIGKILL; at most an hour.
  google.protobuf.Duration grace = 1;
}

message StopResponse {}

message PingRequest {}

message PingResponse {
  // Version of hangar-init.
  string version = 1;
  // How long since hangar-init started.
  google.protobuf.Duration uptime = 2;
}

message ExecRequest {
  oneof message {
    ExecStart start = 1;
    bytes stdin = 2;
    // Closes the process's stdin.
    StdinClose stdin_close = 3;
    WindowSize resize = 4;
    // A signal number to send the process, such as 15.
    int32 signal = 5;
  }
}

// ExecStart starts the process.
message ExecStart {
  Process process = 1;
  // Runs it on a terminal; its stdout and stderr are then one stream.
  bool tty = 2;
  // The terminal's first size, with tty.
  WindowSize size = 3;
}

message StdinClose {}

message WindowSize {
  uint32 rows = 1;
  uint32 cols = 2;
}

message ExecResponse {
  oneof message {
    bytes stdout = 1;
    bytes stderr = 2;
    // The last response.
    ExecExit exit = 3;
  }
}

// ExecExit says how the process ended.
message ExecExit {
  // The exit code; 128 plus the signal's number when a signal ended it.
  int32 code = 1;
  // The signal that ended it, 0 if none.
  int32 signal = 2;
}
