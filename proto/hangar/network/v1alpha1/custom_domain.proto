syntax = "proto3";

package hangar.network.v1alpha1;

import "hangar/meta/v1/meta.proto";
import "hangar/meta/v1/options.proto";

// CustomDomain is a tenant's own DNS domain, such as "example.com", which
// the public endpoints of the tenant's projects may serve under: at the
// domain itself and one label below it. The tenant proves it holds the
// domain by the CNAME its status names, which also lets Hangar get the
// domain's certificates. Only PUBLIC endpoints serve under a CustomDomain.
// See docs/decisions/custom-domains.md.
message CustomDomain {
  option (hangar.meta.v1.resource) = {
    kind: "CustomDomain"
    plural: "customdomains"
    short_names: ["cdom"]
    scope: SCOPE_GLOBAL
  };
  string api_version = 1;
  string kind = 2;
  hangar.meta.v1.ObjectMeta metadata = 3;
  CustomDomainSpec spec = 4;
  CustomDomainStatus status = 5;
}

// CustomDomainSpec is the domain and who may use it.
message CustomDomainSpec {
  // Name of the Tenant the domain belongs to.
  string tenant = 1 [(hangar.meta.v1.field).immutable = true];
  // The domain, in lower case without a trailing dot, such as "example.com".
  // No other tenant's domain may be it, under it or above it.
  string domain = 2 [(hangar.meta.v1.field).immutable = true];
  // Names the Projects of the tenant whose endpoints may serve under the
  // domain; empty lets every project of the tenant.
  repeated string projects = 3;
}

// CustomDomainStatus is what the tenant must put in the domain's DNS, and
// whether it has.
message CustomDomainStatus {
  int64 observed_generation = 1;
  // Verified says whether the challenge record is in the domain's DNS; once
  // true it stays true.
  repeated hangar.meta.v1.Condition conditions = 2;
  // The name _acme-challenge.<domain> must be a CNAME of, such as
  // "k3x9a.acme.hangarlab.dev". It is this CustomDomain's alone, made from
  // its uid, and proves the tenant holds the domain.
  string challenge_target = 3;
  // The records the domain's DNS needs: the challenge's, and those that
  // bring an endpoint's traffic to Hangar.
  repeated CustomDomainRecord records = 4;
}

// CustomDomainRecord is one DNS record a CustomDomain needs.
message CustomDomainRecord {
  // The record's name, such as "_acme-challenge.example.com" or
  // "*.example.com".
  string name = 1;
  // The record's type, such as "CNAME".
  string type = 2;
  // The record's value.
  string value = 3;
  // What the record is for.
  string purpose = 4;
}

// CustomDomainService manages custom domains.
service CustomDomainService {
  rpc GetCustomDomain(GetCustomDomainRequest) returns (GetCustomDomainResponse);
  rpc ListCustomDomains(ListCustomDomainsRequest) returns (ListCustomDomainsResponse);
  rpc WatchCustomDomains(WatchCustomDomainsRequest) returns (stream WatchCustomDomainsResponse);
  rpc ApplyCustomDomain(ApplyCustomDomainRequest) returns (ApplyCustomDomainResponse);
  rpc DeleteCustomDomain(DeleteCustomDomainRequest) returns (DeleteCustomDomainResponse);
  rpc UpdateCustomDomainStatus(UpdateCustomDomainStatusRequest) returns (UpdateCustomDomainStatusResponse);
}

message GetCustomDomainRequest {
  string name = 1;
}

message GetCustomDomainResponse {
  CustomDomain custom_domain = 1;
}

message ListCustomDomainsRequest {
  string label_selector = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListCustomDomainsResponse {
  repeated CustomDomain items = 1;
  string next_page_token = 2;
  int64 revision = 3;
}

message WatchCustomDomainsRequest {
  string label_selector = 1;
  int64 since_revision = 2;
}

message WatchCustomDomainsResponse {
  hangar.meta.v1.EventType type = 1;
  CustomDomain custom_domain = 2;
  int64 revision = 3;
}

message ApplyCustomDomainRequest {
  CustomDomain custom_domain = 1;
  // Refuses an existing object with ALREADY_EXISTS, changing nothing.
  bool create_only = 2;
}

message ApplyCustomDomainResponse {
  CustomDomain custom_domain = 1;
  repeated string warnings = 2;
  bool created = 3;
}

message DeleteCustomDomainRequest {
  string name = 1;
  optional int64 expected_resource_version = 2;
}

message DeleteCustomDomainResponse {
  CustomDomain custom_domain = 1;
}

message UpdateCustomDomainStatusRequest {
  string name = 1;
  CustomDomainStatus status = 2;
  optional int64 expected_resource_version = 3;
}

message UpdateCustomDomainStatusResponse {
  CustomDomain custom_domain = 1;
}
