syntax = "proto3";

package hangar.tenancy.v1alpha1;

import "google/protobuf/timestamp.proto";
import "hangar/compute/v1alpha1/machine.proto";

// TenantCapabilityService answers what a tenant's machines do together,
// read from the nodes they run on when asked, never stored. It is not a
// resource's service, so it is written by hand rather than generated.
service TenantCapabilityService {
  // CPUPoolUsage says how often the tenant's CPU pool slowed its machines
  // over the last hour, minute by minute, the pool's CPUs, and what each
  // running machine in it uses of its CPUs now, from each connected node
  // the pool's running machines are on. It is asked as MemoryPoolUsage
  // is: the get of Containers or VirtualMachines in some project of the
  // tenant, and the machines of a project whose Containers and
  // VirtualMachines the caller may not get are summed into other,
  // unnamed. Such a caller learns the pool's CPUs, how often it slowed,
  // and that sum, nothing more. A tenant with no CPU pool answers nothing
  // set; a tenant that does not exist is NOT_FOUND to a caller over every
  // tenant. See docs/decisions/cpu-pool.md.
  rpc CPUPoolUsage(CPUPoolUsageRequest) returns (CPUPoolUsageResponse);
  // MemoryPoolUsage says who holds the tenant's memory pool now: each
  // running machine in it, with what its guest has, from each connected
  // node they are on. It needs the get of Containers or VirtualMachines
  // in some project of the tenant, so a member of one project alone may
  // ask; the machines of a project whose Containers and VirtualMachines
  // the caller may not get are summed into other, unnamed. Such a caller
  // learns the pool's size, the plan's memory, and those sums of the rest
  // of the tenant, nothing more. A tenant with no memory pool answers
  // nothing set; a tenant that does not exist is NOT_FOUND to a caller
  // over every tenant, as for CPUPoolUsage. See
  // docs/decisions/memory-pool.md.
  rpc MemoryPoolUsage(MemoryPoolUsageRequest) returns (MemoryPoolUsageResponse);
}

message CPUPoolUsageRequest {
  string tenant = 1;
}

message CPUPoolUsageResponse {
  // Of the pool's limit's periods over the last hour, the share, from 0
  // to 1, in which the tenant's machines had used all of the pool's CPUs
  // and waited: the largest of the nodes read, as the pool is held on
  // each node apart. Unset when no node read has a value.
  optional double slowed = 1;
  // The pool's CPUs, in millicores, the most a node read holds it to;
  // unset when none read holds it.
  optional int64 milli_cpu = 2;
  // How many of the nodes the machines in `machines` are on could not be
  // read, as one not connected, or have no CPU sample of the pool's
  // machines lately. The nodes only other's machines are on are not
  // counted.
  int32 nodes_unread = 3;
  // The minutes of the last hour slowed counts, oldest first, at most
  // 60: for each, the largest share of the nodes read that counted it.
  // A minute no node read counted, as one with no sample, is not here.
  repeated CPUPoolMinute minutes = 4;
  // Of the nodes the machines in `machines` are on, when the oldest
  // latest CPU sample of their machines was taken; unset when none has
  // one lately. The nodes only other's machines are on are not counted.
  google.protobuf.Timestamp sample_time = 5;
  // The running machines in the pool the caller may read, by what they
  // use now, largest first (unknown last), then by project and name.
  // FileShare servers are in no pool, so never here.
  repeated CPUPoolMachine machines = 6;
  // The running machines in the pool the caller may not read, summed;
  // unset when there are none.
  CPUPoolTotal other = 7;
}

// CPUPoolMinute is one minute of a CPU pool.
message CPUPoolMinute {
  // When the minute began.
  google.protobuf.Timestamp time = 1;
  // Of the pool's limit's periods in it, the share, from 0 to 1, in which
  // the limit held its machines back.
  double slowed = 2;
}

// CPUPoolMachine is a running machine in a CPU pool.
message CPUPoolMachine {
  string project = 1;
  // The kind of the object it runs, Container or VirtualMachine, and that
  // object's name.
  string kind = 2;
  string name = 3;
  hangar.compute.v1alpha1.MachinePhase phase = 4;
  int32 vcpus = 5;
  // The CPU it used over its node's latest 10 s sample of it, in
  // millicores: how busy its vCPUs were times their count. Unset when its
  // node has no such sample lately, or could not be read.
  optional int64 cpu_now_milli = 6;
}

// CPUPoolTotal sums machines of a CPU pool.
message CPUPoolTotal {
  // What they used over their latest samples, in millicores; a machine
  // with none counts nothing.
  int64 cpu_now_milli = 1;
}

message MemoryPoolUsageRequest {
  string tenant = 1;
}

message MemoryPoolUsageResponse {
  // The pool's size in bytes, the plan's memory; unset when the tenant
  // has no memory pool.
  optional int64 size_bytes = 1;
  // Of the nodes the machines in `machines` are on, when the one that read
  // the pool longest ago last read it; unset when none has read it lately.
  // The nodes only other's machines are on are not counted.
  google.protobuf.Timestamp sample_time = 2;
  // How many of the nodes the machines in `machines` are on could not be
  // read, as one not connected, or have not read the pool lately, which
  // a node keeps for three of its calm polls (docs/decisions/node-agent.md).
  int32 nodes_unread = 3;
  // The running machines in the pool the caller may read, Dedicated
  // first, then by what they use, largest first (what they have when
  // that is unknown, then their reservation), then by project and name.
  // FileShare servers are in no pool, so never here.
  repeated MemoryPoolMachine machines = 4;
  // The running machines in the pool the caller may not read, summed;
  // unset when there are none.
  MemoryPoolTotal other = 5;
}

// MemoryPoolMachine is a running machine in a memory pool.
message MemoryPoolMachine {
  string project = 1;
  // The kind of the object it runs, Container or VirtualMachine, and that
  // object's name.
  string kind = 2;
  string name = 3;
  hangar.compute.v1alpha1.MachinePhase phase = 4;
  // Its memory, the most its guest may have, and the part of it reserved,
  // all of it for a Dedicated machine, in bytes.
  int64 memory_bytes = 5;
  int64 reserved_bytes = 6;
  // What its guest has of its memory now, in bytes: its memory less what
  // its balloon holds, as its node last read it. Unset when its node
  // could not tell.
  optional int64 current_bytes = 7;
  // What its guest uses of what it has, in bytes: its total less its
  // available memory, as the guest last reported it to its node. Unset
  // when the guest reports nothing, or not lately.
  optional int64 in_use_bytes = 10;
  // When the host last killed its VM whole for its pool's memory; unset
  // when it never did.
  google.protobuf.Timestamp last_oom_kill_time = 8;
  // Since when its balloon has not followed what its node asks; unset
  // while it does.
  google.protobuf.Timestamp balloon_unresponsive_since = 9;
}

// MemoryPoolTotal sums machines of a memory pool, in bytes.
message MemoryPoolTotal {
  int64 memory_bytes = 1;
  int64 reserved_bytes = 2;
  // What their guests have now; a machine whose node could not tell
  // counts at its reservation.
  int64 current_bytes = 3;
  // What their guests use; a machine whose guest does not say counts at
  // what it has, or at its reservation when that is unknown too.
  int64 in_use_bytes = 4;
}
