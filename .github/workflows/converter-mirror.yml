name: converter-mirror

# Mirrors the Alpine packages the converter initramfs is built from
# (guest/converter/converter.env) to this repository's release
# converter-deps, which guest/converter/build.sh downloads from first:
# each package the release lacks is downloaded from Alpine, checked
# against its pinned sha256, and uploaded (tools/converterdeps,
# docs/runbook/converter.md). Its only credential is the workflow's
# GITHUB_TOKEN. Every action is pinned to a commit.

on:
  push:
    branches: [main]
    paths: ['guest/converter/converter.env']
  workflow_dispatch:

permissions: {}

concurrency:
  group: converter-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    permissions:
      # Making the release and uploading its assets.
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Mirror the pinned packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./tools/converterdeps mirror -env guest/converter/converter.env
