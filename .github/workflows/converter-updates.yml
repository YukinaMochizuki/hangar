name: converter-updates

# Once a week, compares the Alpine packages the converter initramfs pins
# (guest/converter/converter.env) with Alpine v3.22's index, main and
# community, and its security database, and opens one issue naming each
# package that has a newer version, the versions, and the CVEs fixed since,
# labelled security if there are any; none if an open issue of the same
# title is there already (tools/converterdeps, docs/runbook/converter.md).
# Its only credential is the workflow's GITHUB_TOKEN. Every action is
# pinned to a commit.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: converter-updates
  cancel-in-progress: false

jobs:
  updates:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Compare the pins with Alpine's
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./tools/converterdeps updates -env guest/converter/converter.env -issue -repo "$GITHUB_REPOSITORY"
