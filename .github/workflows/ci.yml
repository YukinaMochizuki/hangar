name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      proto: ${{ steps.filter.outputs.proto }}
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            proto:
              - 'proto/**'
              - 'buf.yaml'
              - 'buf.gen.yaml'
              - 'gen/**'
              - 'tools/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'go.mod'
              - 'Makefile'
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'tools/**'
              - '.golangci.yml'
              - 'Makefile'

  proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Fetch main for breaking-change detection
        if: github.ref != 'refs/heads/main'
        run: git fetch --no-tags --depth=1 origin main:main
      - run: make lint-proto
      - run: make breaking
      - run: make gen-check

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: make lint-go
      - run: make test
