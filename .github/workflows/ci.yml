name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      proto: ${{ steps.filter.outputs.proto }}
      go: ${{ steps.filter.outputs.go }}
      sh: ${{ steps.filter.outputs.sh }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            proto:
              - 'proto/**'
              - 'buf.yaml'
              - 'buf.gen.yaml'
              - 'buf.gen.hangar.yaml'
              - 'gen/**'
              - 'internal/apiserver/servicegen/**'
              - 'sqlc.yaml'
              - 'internal/store/sqlite/**'
              - 'tools/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'go.mod'
              - 'Makefile'
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'tools/**'
              - '.golangci.yml'
              - 'Makefile'
              # test/install runs the CLI's installer.
              - 'deploy/cli/**'
            sh:
              - '**/*.sh'
              - 'deploy/**'
              - 'Makefile'
            web:
              - 'web/**'
              - 'gen/ts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Fetch main for breaking-change detection
        if: github.ref != 'refs/heads/main'
        run: git fetch --no-tags --depth=1 origin main:main
      - run: make lint-proto
      - run: make breaking
      - run: make gen-check

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: make lint-go
      # lint-go type-checks the CLI for this runner's arch only; it is
      # released for both.
      - name: The CLI builds for Windows and macOS on amd64 and arm64
        run: |
          for p in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS=${p%/*} GOARCH=${p#*/} go build -o /dev/null ./cmd/hangar
          done
      - run: make test
      - run: make test-root

  # test/e2e under the race detector, which make test runs without it.
  e2e-race:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: make test-e2e-race

  # The CLI as built for Windows, whose files' DACLs, console and locks only
  # a Windows host can test. No -race: it needs cgo, which Windows lacks
  # here.
  go-windows:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: windows-latest
    steps:
      # Files are checked out as they are, testdata among them.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -timeout 20m ./cmd/hangar/... ./internal/cli/...

  # test/install's install.ps1 cases, which run on Windows alone, under the
  # Windows PowerShell 5.1 Windows ships and under PowerShell 7.
  install-windows:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: install.ps1 under Windows PowerShell 5.1
        run: go test -count=1 -v ./test/install/
      - name: install.ps1 under PowerShell 7
        env:
          HANGAR_TEST_POWERSHELL: pwsh
        run: go test -count=1 -v ./test/install/

  sh:
    needs: changes
    if: needs.changes.outputs.sh == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make lint-sh
      - run: make test-monitoring

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web lint
      - run: pnpm --dir web test
      - run: pnpm --dir web build
