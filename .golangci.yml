version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - misspell
    - nilerr
    - unconvert
    - usestdlibvars
  exclusions:
    generated: strict
    paths:
      - gen/

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/YukinaMochizuki/hangar
  exclusions:
    paths:
      - gen/
